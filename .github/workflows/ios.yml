name: iOS

# The iOS app's checks on GitHub.
#
# A push or pull request that touches ios/ runs only the Linux job here:
# LectioCore's tests, about a minute. The app itself is built, archived and
# UI-tested on Xcode Cloud (ios/XCODE_CLOUD.md, ios/ci_scripts/), which comes
# with the Apple Developer Program and doesn't use GitHub's minutes. GitHub's
# macOS minutes cost about ten times Linux ones, and one push's worth of the
# Mac jobs below (about 70 minutes) used most of a month's allowance.
#
# The Mac jobs are still here for when they're wanted, run by hand:
# Actions > iOS > Run workflow, then tick what to run. Each one uses GitHub
# macOS minutes, unless the repository variable MAC_RUNNER names a
# self-hosted runner on your own Mac (ios/XCODE_CLOUD.md), where it's free.
#   Build        the simulator builds and the release archive check, with the
#                whole log readable here (about 8 minutes)
#   UI tests     the Reading Room tests (about 15 minutes)
#   Screenshots  every screen, light and dark (scripts/ios-screenshots.sh,
#                about 45 minutes)
#   TestFlight   sign and upload. Needs three repository secrets: ASC_KEY_ID,
#                ASC_ISSUER_ID and ASC_KEY_P8 (the contents of the App Store
#                Connect API key's .p8 file, created with the Admin role so
#                Xcode can manage the distribution certificate). See
#                ios/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      build:
        description: Build (simulator builds and the release archive check)
        type: boolean
        default: true
      uitests:
        description: UI tests (Reading Room, line tutor)
        type: boolean
        default: false
      screenshots:
        description: Screenshots (iPhone, iPad, Apple Watch; about 45 minutes)
        type: boolean
        default: false
      testflight:
        description: Upload a build to TestFlight
        type: boolean
        default: false

# Concurrency is per job, not per run: a build waits only for the build
# before it, never for that run's long screenshot job.

jobs:
  core:
    name: LectioCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/LectioCore
        run: swift test

  app:
    name: Build app (iPhone + iPad simulator)
    if: github.event_name == 'workflow_dispatch' && inputs.build
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    concurrency:
      group: ios-app-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: LectioCore tests (macOS)
        working-directory: ios/LectioCore
        run: swift test
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lectio.xcodeproj \
            -scheme Lectio \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E '(error|warning: .*(deprecated|isolat|Sendable))|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log
      - name: Build Apple Watch app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lectio.xcodeproj \
            -scheme LectioWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee watch-build.log | grep -E '(error|warning: .*(deprecated|isolat|Sendable))|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' watch-build.log
      # What TestFlight will receive, built the same way (Release, for a real
      # device, watch app embedded) but unsigned, so a problem that only a
      # device build or an archive has (an extension, the watch app, an asset
      # catalog) shows here and not in the first upload.
      # The same script you run on your Mac to ship (scripts/ios-testflight.sh),
      # in its unsigned mode: it generates the project, stamps the build
      # number and archives the Release build for a real device. Everything
      # but signing and the upload, so a broken release build shows up here.
      - name: Archive for devices (the release script, unsigned)
        run: scripts/ios-testflight.sh --check
      - name: Check what the archive contains
        working-directory: ios
        run: |
          APP=build/Lectio.xcarchive/Products/Applications/Lectio.app
          test -d "$APP" || { echo "::error::no Lectio.app in the archive"; exit 1; }
          echo "Plug-ins:"; ls "$APP/PlugIns"
          test -d "$APP/PlugIns/LectioWidgets.appex" || { echo "::error::widgets extension missing"; exit 1; }
          test -d "$APP/Watch/Lectio.app" || { echo "::error::watch app is not embedded"; exit 1; }
          test -d "$APP/Watch/Lectio.app/PlugIns/LectioWatchWidgets.appex" || { echo "::error::watch complications missing"; exit 1; }
          test -d "$APP/Content" || { echo "::error::content bundle missing"; exit 1; }
          test -d "$APP/scansion" || { echo "::error::scansion corpus missing"; exit 1; }
          for p in "$APP/Info.plist" "$APP/Watch/Lectio.app/Info.plist"; do
            echo "$p"; plutil -p "$p" | grep -E 'MinimumOSVersion|CFBundleVersion|CFBundleShortVersionString|WKCompanionAppBundleIdentifier'
          done
          grep -q '"MinimumOSVersion" => "17.0"' <(plutil -p "$APP/Info.plist") || { echo "::error::the app should support iOS 17"; exit 1; }
          # The app icon is an Icon Composer file (Lectio/Resources/Lectio-icon.icon).
          # If project.yml's icon name or XcodeGen's version is wrong, the build still
          # succeeds and quietly keeps the old icon, so check the built app has it.
          echo "Icon entries:"; plutil -p "$APP/Info.plist" | grep -i 'icon' || true
          grep -q 'Lectio-icon' <(plutil -p "$APP/Info.plist") || { echo "::error::the app icon (Lectio-icon.icon) isn't in the built app: check ASSETCATALOG_COMPILER_APPICON_NAME in project.yml and that XcodeGen is 2.45.1 or later"; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::no compiled assets (Assets.car) in the app"; exit 1; }
          du -sh "$APP"
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/*.log

  uitests:
    name: UI tests (Reading Room, line tutor)
    if: github.event_name == 'workflow_dispatch' && inputs.uitests
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    concurrency:
      group: ios-uitests-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: brew install xcodegen
      - name: Generate project (with the UI tests)
        working-directory: ios
        run: xcodegen generate --spec project-uitests.yml
      - name: Run the UI tests
        working-directory: ios
        run: |
          set -o pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in runtime for d in ds]
          for want in ('iPhone 17 Pro', 'iPhone 17', 'iPhone'):
              for d in devices:
                  if d['name'].startswith(want):
                      print(d['udid']); sys.exit()
          ")
          echo "Simulator: $udid"
          # Boot it fully first: a test that launches the app while the
          # simulator is still starting fails with "Failed to get background
          # assertion ... Timed out", which is the runner's doing, not the app's.
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # A test that fails is run again (up to three tries in all); only a
          # test that fails every time fails the job.
          xcodebuild test -project Lectio.xcodeproj -scheme LectioUITests \
            -destination "id=$udid" -derivedDataPath build -resultBundlePath build/uitests.xcresult \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO \
            | tee uitests.log | grep -E "Test Case|error:|skipped|\*\* TEST" || true
          grep -q '\*\* TEST SUCCEEDED \*\*' uitests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uitests
          path: |
            ios/uitests.log
            ios/build/uitests.xcresult

  screenshots:
    name: Screenshots (iPhone + iPad + Apple Watch, light + dark)
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    concurrency:
      group: ios-screenshots-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # The same script you can run on your Mac: every screen on an iPhone and
      # an iPad, light and dark, large text, the first run, the classic look,
      # and the Apple Watch app (which App Store Connect asks for too).
      - name: Capture
        run: scripts/ios-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/shots
          retention-days: 14

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: [core]
    runs-on: ${{ vars.MAC_RUNNER || 'macos-26' }}
    steps:
      # Fail in seconds, saying what to add, rather than after a ten-minute
      # build with an authentication error.
      - name: Check the App Store Connect secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions (see ios/README.md, Shipping to TestFlight)."
            exit 1
          fi
          case "$ASC_KEY_P8" in
            *"BEGIN PRIVATE KEY"*) ;;
            *) echo "::error::ASC_KEY_P8 should be the full contents of the .p8 file, including the BEGIN PRIVATE KEY line."; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - name: Toolchain
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
      - name: Archive
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Lectio.xcodeproj \
            -scheme Lectio \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lectio.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION="$(date -u +%y%m%d%H%M)" \
            | tee archive.log | grep -E '(error:|ARCHIVE (SUCCEEDED|FAILED))' || true
          grep -q 'ARCHIVE SUCCEEDED' archive.log
      - name: Upload
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Lectio.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            | tee export.log | grep -E '(error:|EXPORT (SUCCEEDED|FAILED)|Upload|Uploaded)' || true
          grep -qE 'EXPORT SUCCEEDED|Uploaded' export.log
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            ios/archive.log
            ios/export.log
            ~/Library/Logs/gym/*.log
          if-no-files-found: ignore
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
