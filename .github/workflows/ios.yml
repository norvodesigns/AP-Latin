name: iOS

# Builds and tests the native app. Everything under ios/ is written on a Linux
# machine that can't compile for iOS, so this workflow is the proof that the
# Swift builds before anyone opens Xcode.
#
# Manual runs (Actions → iOS → Run workflow) can also upload a TestFlight
# build. That needs three repository secrets — ASC_KEY_ID, ASC_ISSUER_ID and
# ASC_KEY_P8 (the contents of the App Store Connect API key's .p8 file,
# created with the Admin role so Xcode can manage the distribution
# certificate). See ios/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'public/scansion/**'
      - 'src/data/**'
      - 'src/lib/latin.ts'
      - 'src/lib/mergeProgress.ts'
      - 'src/store/useStore.ts'
      - 'scripts/export-*.ts'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'public/scansion/**'
      - 'src/data/**'
      - 'src/lib/latin.ts'
      - 'src/lib/mergeProgress.ts'
      - 'src/store/useStore.ts'
      - 'scripts/export-*.ts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a build to TestFlight
        type: boolean
        default: false

# Concurrency is per job, not per run: a build waits only for the build
# before it, never for that run's long screenshot job. Pushes to main queue
# (a newer one replaces one still waiting); a pull request's newer push
# cancels its older one.

jobs:
  core:
    name: LectioCore tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/LectioCore
        run: swift test

  app:
    name: Build app (iPhone + iPad simulator)
    runs-on: macos-26
    concurrency:
      group: ios-app-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: LectioCore tests (macOS)
        working-directory: ios/LectioCore
        run: swift test
      - name: Build
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lectio.xcodeproj \
            -scheme Lectio \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E '(error|warning: .*(deprecated|isolat|Sendable))|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log
      - name: Build Apple Watch app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Lectio.xcodeproj \
            -scheme LectioWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tee watch-build.log | grep -E '(error|warning: .*(deprecated|isolat|Sendable))|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' watch-build.log
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/*build.log

  screenshots:
    name: Screenshots (iPhone + iPad, light + dark)
    if: github.event_name != 'pull_request'
    needs: [app]
    runs-on: macos-26
    concurrency:
      group: ios-screenshots-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project Lectio.xcodeproj -scheme Lectio \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            | grep -E 'error|BUILD (SUCCEEDED|FAILED)' || true
          test -d build/Build/Products/Debug-iphonesimulator/Lectio.app
      - name: Capture
        working-directory: ios
        run: |
          mkdir -p shots
          pick() {
            xcrun simctl list devices available -j | python3 -c "
          import json, sys
          want = sys.argv[1:]
          devices = [d for runtime, ds in json.load(sys.stdin)['devices'].items() if 'iOS' in runtime for d in ds]
          for w in want:
              for d in devices:
                  if w in d['name']:
                      print(d['udid']); sys.exit()
          " "$@"
          }
          shoot() {
            local udid="$1" label="$2"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/Lectio.app
            for mode in light dark; do
              xcrun simctl ui "$udid" appearance "$mode"
              # A fresh launch per screen, opened with -startTab: a lectio://
              # URL from simctl stops at an "Open in Lectio?" prompt.
              for tab in today learn learn/prima-2-3 learn/daily learn/sentences read vocab quiz scansion forge grammar exam plan settings read/aen-1-1-33 read/pliny-6-16-a; do
                xcrun simctl terminate "$udid" com.norvodesigns.lectio || true
                xcrun simctl launch "$udid" com.norvodesigns.lectio -seedDemo YES -startTab "$tab"
                sleep 8
                xcrun simctl io "$udid" screenshot "shots/$label-$mode-${tab//\//-}.png"
              done
              # Large text (Dynamic Type, accessibility sizes), a few screens.
              if [ "$mode" = light ]; then
                xcrun simctl ui "$udid" content_size accessibility-extra-large || true
                for tab in today learn/prima-2-3 learn/daily vocab; do
                  xcrun simctl terminate "$udid" com.norvodesigns.lectio || true
                  xcrun simctl launch "$udid" com.norvodesigns.lectio -seedDemo YES -startTab "$tab"
                  sleep 8
                  xcrun simctl io "$udid" screenshot "shots/$label-$mode-bigtext-${tab//\//-}.png"
                done
                xcrun simctl ui "$udid" content_size large || true
              fi
              # The first run, a step at a time.
              for step in welcome track placement goal; do
                xcrun simctl terminate "$udid" com.norvodesigns.lectio || true
                xcrun simctl launch "$udid" com.norvodesigns.lectio -showOnboarding YES -onboardingStep "$step"
                sleep 8
                xcrun simctl io "$udid" screenshot "shots/$label-$mode-onboarding-$step.png"
              done
            done
            xcrun simctl shutdown "$udid" || true
          }
          shoot "$(pick 'iPhone 17 Pro Max' 'Pro Max' 'iPhone')" iphone
          shoot "$(pick '13-inch' 'iPad Pro' 'iPad')" ipad
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ios/shots

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: [core, app]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/key.p8"
      - name: Archive
        working-directory: ios
        run: |
          xcodebuild archive \
            -project Lectio.xcodeproj \
            -scheme Lectio \
            -destination 'generic/platform=iOS' \
            -archivePath build/Lectio.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}
      - name: Upload
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Lectio.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
