name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run verify
      # The iOS app bundles src/data as JSON, and ports the progress logic
      # against fixtures the TypeScript generates; the website lists lessons
      # from a generated outline. All must be regenerated (and committed)
      # whenever the source they come from changes.
      - run: npm run export:content -- --check
      - run: npm run export:fixtures -- --check
      - run: npm run export:outline -- --check
      - run: npm run build
