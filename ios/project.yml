# XcodeGen spec for the Lectio iOS/iPadOS app.
#
# The .xcodeproj is generated from this file and not committed, so it can
# never drift or conflict. After pulling:
#
#     brew install xcodegen      # once
#     cd ios && xcodegen
#     open Lectio.xcodeproj
#
# Re-run `xcodegen` whenever files are added or removed.
#
# One build runs on iOS 17 and later (watchOS 10 and later): Liquid Glass on iOS
# and watchOS 26+, a material look before that (Lectio/Design/GlassCompat.swift).

name: Lectio

options:
  bundleIdPrefix: com.norvodesigns
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: M46ZNP323Y
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # Xcode 26's defaults for new app projects: UI code is main-actor
    # isolated unless it says otherwise.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  LectioCore:
    path: LectioCore
  # Ads (ios/ADS.md): Google AdMob, and its consent form (the User Messaging
  # Platform). Only the iPhone/iPad app uses them; the widgets and the watch
  # app don't link them.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 3.0.0

targets:
  Lectio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Lectio
      # The exported content bundle (npm run export:content), copied in as a
      # folder so the app reads it with Bundle.main.url(forResource: "Content").
      - path: Content
        type: folder
        buildPhase: resources
      # The Aeneid scansion corpus, straight from the website's own files.
      - path: ../public/scansion
        type: folder
        buildPhase: resources
    dependencies:
      - package: LectioCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: UserMessagingPlatform
      - target: LectioWidgets
      # The watch app ships inside the iPhone app (Lectio.app/Watch), which
      # is how the App Store delivers it to a paired watch.
      - target: LectioWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    entitlements:
      path: Lectio/Lectio.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.norvodesigns.lectio
    info:
      path: Lectio/Info.plist
      properties:
        CFBundleDisplayName: Lectio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        # A timed practice-exam section shows as a Live Activity.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - EBGaramond-VF.ttf
          - EBGaramond-Italic-VF.ttf
          - Italianno.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Ads (ios/ADS.md). The IDs come from the build settings just below;
        # AdConfig.swift refuses to show anything from Google's sample IDs in a
        # Release build, so until real IDs are here the App Store build has no ads.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        LectioAdBannerUnitID: $(ADMOB_BANNER_UNIT_ID)
        LectioAdInterstitialUnitID: $(ADMOB_INTERSTITIAL_UNIT_ID)
        # Google's list of ad networks that may buy a Lectio ad (it asks to be
        # kept up to date: developers.google.com/admob/ios/quick-start).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork
          - SKAdNetworkIdentifier: ludvb6z3bs.skadnetwork
          - SKAdNetworkIdentifier: cp8zw746q7.skadnetwork
          - SKAdNetworkIdentifier: 3sh42y64q3.skadnetwork
          - SKAdNetworkIdentifier: c6k4g5qg8m.skadnetwork
          - SKAdNetworkIdentifier: s39g8k73mm.skadnetwork
          - SKAdNetworkIdentifier: wg4vff78zm.skadnetwork
          - SKAdNetworkIdentifier: 3qy4746246.skadnetwork
          - SKAdNetworkIdentifier: f38h382jlk.skadnetwork
          - SKAdNetworkIdentifier: hs6bdukanm.skadnetwork
          - SKAdNetworkIdentifier: mlmmfzh3r3.skadnetwork
          - SKAdNetworkIdentifier: v4nxqhlyqp.skadnetwork
          - SKAdNetworkIdentifier: wzmmz9fp6w.skadnetwork
          - SKAdNetworkIdentifier: su67r6k2v3.skadnetwork
          - SKAdNetworkIdentifier: yclnxrl5pm.skadnetwork
          - SKAdNetworkIdentifier: t38b2kh725.skadnetwork
          - SKAdNetworkIdentifier: 7ug5zh24hu.skadnetwork
          - SKAdNetworkIdentifier: gta9lk7p23.skadnetwork
          - SKAdNetworkIdentifier: vutu7akeur.skadnetwork
          - SKAdNetworkIdentifier: y5ghdn5j9k.skadnetwork
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          - SKAdNetworkIdentifier: 47vhws6wlr.skadnetwork
          - SKAdNetworkIdentifier: kbd757ywx3.skadnetwork
          - SKAdNetworkIdentifier: 9t245vhmpl.skadnetwork
          - SKAdNetworkIdentifier: a2p9lx4jpn.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          - SKAdNetworkIdentifier: 44jx6755aq.skadnetwork
          - SKAdNetworkIdentifier: k674qkevps.skadnetwork
          - SKAdNetworkIdentifier: 4468km3ulz.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
          - SKAdNetworkIdentifier: 8s468mfl3y.skadnetwork
          - SKAdNetworkIdentifier: klf5c3l5u5.skadnetwork
          - SKAdNetworkIdentifier: ppxm28t8ap.skadnetwork
          - SKAdNetworkIdentifier: kbmxgpxpgc.skadnetwork
          - SKAdNetworkIdentifier: uw77j35x4d.skadnetwork
          - SKAdNetworkIdentifier: 578prtvx9j.skadnetwork
          - SKAdNetworkIdentifier: 4dzt52r2t5.skadnetwork
          - SKAdNetworkIdentifier: tl55sbb4fm.skadnetwork
          - SKAdNetworkIdentifier: c3frkrj4fj.skadnetwork
          - SKAdNetworkIdentifier: e5fvkxwrpn.skadnetwork
          - SKAdNetworkIdentifier: 8c4e2ghe7u.skadnetwork
          - SKAdNetworkIdentifier: 3rd42ekr43.skadnetwork
          - SKAdNetworkIdentifier: 97r2b46745.skadnetwork
          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
        # lectio://auth-callback — where Supabase confirmation emails return.
        CFBundleURLTypes:
          - CFBundleURLName: com.norvodesigns.lectio
            CFBundleURLSchemes: [lectio]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norvodesigns.lectio
        PRODUCT_NAME: Lectio
        TARGETED_DEVICE_FAMILY: "1,2"
        # AdMob IDs. These are Google's published SAMPLE IDs, which only ever
        # serve labelled test ads (and, in a Release build, none at all).
        # Replace all three with the real ones from admob.google.com:
        #   ADMOB_APP_ID               ca-app-pub-1234567890123456~1234567890
        #   ADMOB_BANNER_UNIT_ID       ca-app-pub-1234567890123456/1234567890
        #   ADMOB_INTERSTITIAL_UNIT_ID ca-app-pub-1234567890123456/0987654321
        ADMOB_APP_ID: ca-app-pub-3940256099942544~1458002511
        ADMOB_BANNER_UNIT_ID: ca-app-pub-3940256099942544/2435281174
        ADMOB_INTERSTITIAL_UNIT_ID: ca-app-pub-3940256099942544/4411468910
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Colors are referenced through `Palette` (Design/Palette.swift) by name.
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
        ENABLE_PREVIEWS: "YES"
        SUPPORTS_MACCATALYST: "NO"

  LectioWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LectioWidgets
    dependencies:
      - package: LectioCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: LectioWidgets/LectioWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.norvodesigns.lectio
    info:
      path: LectioWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lectio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norvodesigns.lectio.widgets
        PRODUCT_NAME: LectioWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"

  LectioWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LectioWatch
    dependencies:
      - package: LectioCore
      # The complications, embedded in the watch app.
      - target: LectioWatchWidgets
    entitlements:
      path: LectioWatch/LectioWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.norvodesigns.lectio
    info:
      path: LectioWatch/Info.plist
      properties:
        CFBundleDisplayName: Lectio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.norvodesigns.lectio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norvodesigns.lectio.watchkitapp
        PRODUCT_NAME: Lectio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"

  LectioWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LectioWatchWidgets
    dependencies:
      - package: LectioCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: LectioWatchWidgets/LectioWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.norvodesigns.lectio
    info:
      path: LectioWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Lectio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.norvodesigns.lectio.watchkitapp.widgets
        PRODUCT_NAME: LectioWatchWidgets
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: "YES"

schemes:
  LectioWatch:
    build:
      targets:
        LectioWatch: all
  Lectio:
    build:
      targets:
        Lectio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LectioCore/LectioCoreTests
    archive:
      config: Release
